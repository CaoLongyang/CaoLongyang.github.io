<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沈迟 · 手卷</title>
<meta name="description" content="一卷待展的手卷。">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/scroll.css">
<link rel="stylesheet" href="css/paper.css">
</head>
<body>

<main class="scene">

  <div class="scroll">
    <div class="roller" aria-hidden="true"></div>

    <div class="view">
      <div class="paper">
        <div class="cols">
          <p class="col" style="--i:0">紙上尚空</p>
          <p class="col" style="--i:1">待君落筆</p>
        </div>
        <div class="note">內容排版 · 另行設計</div>
        <div class="yin" aria-hidden="true">沈</div>
      </div>
    </div>

    <div class="roller" aria-hidden="true"></div>
  </div>

  <div class="seal-wrap">
    <button class="seal" id="seal" type="button" aria-label="展开手卷">
      <span class="shard"><span>卷</span></span>
      <span class="shard"><span>卷</span></span>
      <span class="shard"><span>卷</span></span>
      <span class="shard"><span>卷</span></span>
    </button>
  </div>

</main>

<button class="skip" id="skip" type="button">跳过</button>
<button class="replay" id="replay" type="button">重看开场</button>

<script src="js/unroll.js"></script>
</body>
</html>
