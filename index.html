<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shen Chi · Scroll</title>
<meta name="description" content="A handscroll, unrolled.">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/scroll.css">
<link rel="stylesheet" href="css/paper.css">
</head>
<body>

<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="roughen" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.018" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="20" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="inkEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="4" result="m"/>
      <feDisplacementMap in="SourceGraphic" in2="m" scale="40" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="bandEdge" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.07" numOctaves="3" seed="17" result="b"/>
      <feDisplacementMap in="SourceGraphic" in2="b" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="waxEdge" x="-22%" y="-22%" width="144%" height="144%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="4" seed="23" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<main class="scene">

  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <span class="slash" aria-hidden="true">/</span>
    <button type="button" data-lang="zh" aria-pressed="false">中</button>
  </div>

  <div class="scroll">
    <div class="roller" aria-hidden="true"></div>

    <div class="view">
      <div class="paper">

        <div class="ink" aria-hidden="true"></div>
        <div class="roll" aria-hidden="true"></div>

        <div class="lead">
          <p class="kicker"
             data-en="No. 01 — An unrolled scroll"
             data-zh="第一卷 — 手卷初展">No. 01 — An unrolled scroll</p>

          <h1 class="lead-title"
              data-en="The paper is still blank."
              data-zh="紙上尚空。">The paper is still blank.</h1>

          <p class="sub"
             data-en="Layout comes before words. What you see is the frame: the type, the spacing, and the burnt edge of a sheet that has been through something."
             data-zh="版式先于文字。你现在看到的只是骨架——字体、间距，和一张烧过的纸留下的焦边。">Layout comes before words. What you see is the frame: the type, the spacing, and the burnt edge of a sheet that has been through something.</p>
        </div>

        <div class="yinshou" aria-hidden="true">沈遲手卷</div>

        <p class="meta">scroll-site · v0.1</p>
        <div class="yin" aria-hidden="true">沈</div>

        <div class="char" aria-hidden="true"></div>
      </div>
    </div>

    <div class="roller" aria-hidden="true"></div>
  </div>

  <div class="band-wrap" id="bandWrap" aria-hidden="true">
    <div class="band"></div>
  </div>

  <div class="seal-wrap">
    <button class="seal" id="seal" type="button" aria-label="Break the wax and unroll">
      <span class="wax" aria-hidden="true"></span>
      <span class="wax-mark" aria-hidden="true">沈</span>
    </button>
  </div>

</main>

<button class="skip" id="skip" type="button" data-en="SKIP" data-zh="跳过">SKIP</button>
<button class="replay" id="replay" type="button" data-en="REPLAY INTRO" data-zh="重看开场">REPLAY INTRO</button>

<script src="js/unroll.js"></script>
</body>
</html>
