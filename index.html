<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shen Chi · Scroll</title>
<meta name="description" content="A handscroll, tied with twine and sealed with wax.">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/scroll.css">
<link rel="stylesheet" href="css/paper.css">
</head>
<body>

<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="roughen" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024 0.032" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="burnEdge" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.055" numOctaves="5" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="inkEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="4" result="m"/>
      <feDisplacementMap in="SourceGraphic" in2="m" scale="40" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="bandEdge" x="-10%" y="-14%" width="120%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.07" numOctaves="3" seed="17" result="b"/>
      <feDisplacementMap in="SourceGraphic" in2="b" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="waxEdge" x="-22%" y="-22%" width="144%" height="144%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="4" seed="23" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<main class="scene">

  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <span class="slash" aria-hidden="true">/</span>
    <button type="button" data-lang="zh" aria-pressed="false">中</button>
  </div>

  <div class="tilt" id="tilt">

    <div class="scroll">
      <div class="roller" aria-hidden="true"></div>

      <div class="view">
        <div class="paper">

          <div class="ink" aria-hidden="true"></div>
          <div class="roll" aria-hidden="true"></div>

          <div class="lead">
            <p class="kicker"
               data-en="No. 01 — An unrolled scroll"
               data-zh="第一卷 — 手卷初展">No. 01 — An unrolled scroll</p>

            <h1 class="lead-title"
                data-en="The paper is still blank."
                data-zh="紙上尚空。">The paper is still blank.</h1>

            <p class="sub"
               data-en="Layout comes before words. What you see is the frame: the type, the spacing, and the burnt edge of a sheet that has been through something."
               data-zh="版式先于文字。你现在看到的只是骨架——字体、间距，和一张烧过的纸留下的焦边。">Layout comes before words. What you see is the frame: the type, the spacing, and the burnt edge of a sheet that has been through something.</p>
          </div>

          <div class="yinshou" aria-hidden="true">沈遲手卷</div>

          <p class="meta">scroll-site · v0.2</p>
          <div class="yin" aria-hidden="true">沈</div>

          <div class="char" aria-hidden="true"></div>
        </div>
      </div>

      <div class="roller" aria-hidden="true"></div>
    </div>

    <div class="twine-wrap" id="twineWrap" aria-hidden="true">
      <div class="twine"></div>
    </div>

    <div class="seal-wrap">
      <svg class="cord" viewBox="0 0 60 84" aria-hidden="true" focusable="false">
        <path d="M4 3 C 9 33, 23 56, 51 80"
              fill="none" stroke="#85683a" stroke-width="5.8" stroke-linecap="round"/>
        <path d="M4 3 C 9 33, 23 56, 51 80"
              fill="none" stroke="rgba(226,208,172,.3)" stroke-width="1.4"
              stroke-linecap="round" transform="translate(-1,-1)"/>
        <path d="M4 3 C 9 33, 23 56, 51 80"
              fill="none" stroke="rgba(40,26,10,.44)" stroke-width="5.8"
              stroke-linecap="round" stroke-dasharray="1.6 4"/>
      </svg>

      <button class="seal" id="seal" type="button" aria-label="Break the wax and unroll">
        <svg class="waxsvg" viewBox="0 0 120 100" aria-hidden="true" focusable="false">
          <defs>
            <radialGradient id="waxFill" gradientUnits="userSpaceOnUse" cx="44" cy="30" r="86">
              <stop offset="0" stop-color="#a63219"/>
              <stop offset=".3" stop-color="#8a2010"/>
              <stop offset=".58" stop-color="#6b1507"/>
              <stop offset=".82" stop-color="#520e03"/>
              <stop offset="1" stop-color="#3c0801"/>
            </radialGradient>
            <filter id="waxBlob" x="-18%" y="-18%" width="136%" height="136%">
              <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="4" seed="11" result="t"/>
              <feDisplacementMap in="SourceGraphic" in2="t" scale="9"
                                 xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <filter id="waxSoft" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="2.6"/>
            </filter>
          </defs>

          <!-- 压出来溢的一小片，压在主块下面，和主块连成一体 -->
          <g filter="url(#waxBlob)">
            <path d="M16 76 C 4 78 0 86 5 91 C 10 96 26 95 29 88 C 31 82 26 75 16 76 Z"
                  fill="url(#waxFill)"/>
            <path d="M7 47 C 4 29 17 12 35 9 C 49 6.4 62 8 74 10
                     C 96 13 114 26 113 47 C 112 67 99 82 79 88
                     C 61 93 43 91 27 84 C 11 77 8 63 7 47 Z"
                  fill="url(#waxFill)"/>
          </g>

          <!-- 印面凹下去的一块，边缘糊一点 -->
          <ellipse cx="59" cy="46" rx="34" ry="27" fill="#4a0c02" opacity=".42"
                   filter="url(#waxSoft)"/>

          <!-- 外沿反光：蜡被压开时堆起来的那圈边 -->
          <path d="M7 47 C 4 29 17 12 35 9 C 49 6.4 62 8 74 10
                   C 96 13 114 26 113 47 C 112 67 99 82 79 88
                   C 61 93 43 91 27 84 C 11 77 8 63 7 47 Z"
                fill="none" stroke="#b8562e" stroke-width="3.4" opacity=".17"
                transform="translate(60,49) scale(.95) translate(-60,-49)"
                filter="url(#waxSoft)"/>

          <!-- 印圈 -->
          <circle cx="59" cy="46" r="26.5" fill="none"
                  stroke="#2e0600" stroke-width="3" opacity=".42"/>
          <circle cx="59" cy="46" r="26.5" fill="none"
                  stroke="#e08050" stroke-width="1" opacity=".26"
                  transform="translate(0,1.6)"/>

          <!-- 印文：压进去的字，下沿留一道反光 -->
          <text x="59" y="47" text-anchor="middle" dominant-baseline="central"
                font-size="37" font-weight="600" fill="#ffb08a" opacity=".2"
                transform="translate(0,1.6)"
                font-family="Georgia,'Songti SC','SimSun',serif">沈</text>
          <text x="59" y="47" text-anchor="middle" dominant-baseline="central"
                font-size="37" font-weight="600" fill="#2a0500" opacity=".78"
                font-family="Georgia,'Songti SC','SimSun',serif">沈</text>

          <!-- 蜡面反光 -->
          <ellipse cx="38" cy="22" rx="20" ry="8" fill="#ff9d72" opacity=".12"
                   transform="rotate(-16 38 22)" filter="url(#waxSoft)"/>
        </svg>
      </button>
    </div>

  </div>

</main>

<button class="skip" id="skip" type="button" data-en="SKIP" data-zh="跳过">SKIP</button>
<button class="replay" id="replay" type="button" data-en="REPLAY INTRO" data-zh="重看开场">REPLAY INTRO</button>

<p class="colophon">
  <span class="c1">沈遲</span>
  <span class="c2">handscroll · mmxxvi</span>
</p>

<script src="js/unroll.js"></script>
</body>
</html>
