<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布带书签 · 工坊</title>
<script>try{var t=localStorage.getItem('scroll-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'day')}catch(e){}</script>
<link rel="stylesheet" href="../../core/tokens.css">
<link rel="stylesheet" href="../../core/reset.css">
<link rel="stylesheet" href="../../features/stage/stage.css">

</head>
<body data-demo="布带书签 · bookmarks" data-actions="reload" data-start="open">
<div hidden><i id="works" data-bookmark data-mark="画心" data-name="Works"></i><i id="notes" data-bookmark data-mark="题跋" data-name="Notes"></i><i id="fragments" data-bookmark data-mark="拾零" data-name="Fragments"></i><i id="contact" data-bookmark data-mark="拖尾" data-name="Colophon"></i></div>
<div class="rail"><main class="scene"><p style="position:relative;z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--chrome)">悬停会摆 · 点击变成当前段</p></main></div>
<sc-bookmarks style="--pw:60vw"></sc-bookmarks>
<script type="module">
  import '../../lab/demo-kit.js';
  import '../../core/filters.js';
  import '../../features/stage/stage.js';
  import '../../features/bookmarks/bookmarks.js';
  import { EV, emit, on } from '../../core/events.js';
  on(EV.GOTO, ({ id }) => emit(EV.SECTION, { id }));
</script>
