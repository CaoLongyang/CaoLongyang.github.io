        <div class="roller"></div>
        <div class="view"><div class="paper"><div class="track" data-track><section class="panel" id="p1" data-panel style="--span:1"><div class="panel-inner"><header class="panel-head"><h2 class="panel-mark" aria-hidden="true">第一</h2><p class="kicker" data-ink>No. 01</p><h3 class="panel-title" data-ink>往下滚，纸往右送。</h3><div class="tally" data-ink><div><b data-count="2">0</b><span>cards</span></div></div></header><div class="panel-body" style="display:grid;grid-template-columns:repeat(2,1fr);direction:rtl;gap:24px;align-content:center"><div data-float style="--i:0;--r:-1.5deg;padding:22px;background:rgba(255,252,240,.7);box-shadow:0 8px 16px -10px rgba(70,50,24,.5)"><svg viewBox="0 0 120 60" data-draw style="width:100%;height:auto"><path pathLength="1" d="M10 50 C 30 10, 60 10, 110 40" style="fill:none;stroke:var(--ink);stroke-width:1.4"/></svg><p style="margin:10px 0 0;font-size:13px">卡片 1</p></div><div data-float style="--i:1;--r:1deg;padding:22px;background:rgba(255,252,240,.7);box-shadow:0 8px 16px -10px rgba(70,50,24,.5)"><svg viewBox="0 0 120 60" data-draw style="width:100%;height:auto"><path pathLength="1" d="M10 50 C 30 10, 60 10, 110 40" style="fill:none;stroke:var(--ink);stroke-width:1.4"/></svg><p style="margin:10px 0 0;font-size:13px">卡片 2</p></div></div></div></section><section class="panel" id="p2" data-panel style="--span:1.3"><div class="panel-inner"><header class="panel-head"><h2 class="panel-mark" aria-hidden="true">第二</h2><p class="kicker" data-ink>No. 02</p><h3 class="panel-title" data-ink>卡片浮出，线一笔画出。</h3><div class="tally" data-ink><div><b data-count="4">0</b><span>cards</span></div></div></header><div class="panel-body" style="display:grid;grid-template-columns:repeat(4,1fr);direction:rtl;gap:24px;align-content:center"><div data-float style="--i:0;--r:-1.5deg;padding:22px;background:rgba(255,252,240,.7);box-shadow:0 8px 16px -10px rgba(70,50,24,.5)"><svg viewBox="0 0 120 60" data-draw style="width:100%;height:auto"><path pathLength="1" d="M10 50 C 30 10, 60 10, 110 40" style="fill:none;stroke:var(--ink);stroke-width:1.4"/></svg><p style="margin:10px 0 0;font-size:13px">卡片 1</p></div><div data-float style="--i:1;--r:1deg;padding:22px;background:rgba(255,252,240,.7);box-shadow:0 8px 16px -10px rgba(70,50,24,.5)"><svg viewBox="0 0 120 60" data-draw style="width:100%;height:auto"><path pathLength="1" d="M10 50 C 30 10, 60 10, 110 40" style="fill:none;stroke:var(--ink);stroke-width:1.4"/></svg><p style="margin:10px 0 0;font-size:13px">卡片 2</p></div><div data-float style="--i:2;--r:-0.6deg;padding:22px;background:rgba(255,252,240,.7);box-shadow:0 8px 16px -10px rgba(70,50,24,.5)"><svg viewBox="0 0 120 60" data-draw style="width:100%;height:auto"><path pathLength="1" d="M10 50 C 30 10, 60 10, 110 40" style="fill:none;stroke:var(--ink);stroke-width:1.4"/></svg><p style="margin:10px 0 0;font-size:13px">卡片 3</p></div><div data-float style="--i:3;--r:1.8deg;padding:22px;background:rgba(255,252,240,.7);box-shadow:0 8px 16px -10px rgba(70,50,24,.5)"><svg viewBox="0 0 120 60" data-draw style="width:100%;height:auto"><path pathLength="1" d="M10 50 C 30 10, 60 10, 110 40" style="fill:none;stroke:var(--ink);stroke-width:1.4"/></svg><p style="margin:10px 0 0;font-size:13px">卡片 4</p></div></div></div></section><section class="panel" id="p3" data-panel style="--span:1.3"><div class="panel-inner"><header class="panel-head"><h2 class="panel-mark" aria-hidden="true">第三</h2><p class="kicker" data-ink>No. 03</p><h3 class="panel-title" data-ink>数字从零滚上来。</h3><div class="tally" data-ink><div><b data-count="3">0</b><span>cards</span></div></div></header><div class="panel-body" style="display:grid;grid-template-columns:repeat(3,1fr);direction:rtl;gap:24px;align-content:center"><div data-float style="--i:0;--r:-1.5deg;padding:22px;background:rgba(255,252,240,.7);box-shadow:0 8px 16px -10px rgba(70,50,24,.5)"><svg viewBox="0 0 120 60" data-draw style="width:100%;height:auto"><path pathLength="1" d="M10 50 C 30 10, 60 10, 110 40" style="fil
